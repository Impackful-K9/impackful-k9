<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Training in Metro Vancouver | Impackful K9</title>
  <meta name="description" content="Calm, confident dogs through real-world training across Metro Vancouver. Private programs for reactivity, recall, leash manners and puppies.">
  <link rel="canonical" href="https://www.impackfulk9.com/">

  <!-- Open Graph / social (per-page values are kept in sync by js/seo-router.js) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Impackful K9">
  <meta property="og:title" content="Dog Training in Metro Vancouver | Impackful K9">
  <meta property="og:description" content="Calm, confident dogs through real-world training across Metro Vancouver. Private programs for reactivity, recall, leash manners and puppies.">
  <meta property="og:url" content="https://www.impackfulk9.com/">
  <meta property="og:image" content="https://www.impackfulk9.com/images/hero.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Google Analytics (GA4). send_page_view:false — js/seo-router.js fires one
       page_view per client-side page change, initial load included. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V0L3D8C6TW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-V0L3D8C6TW', { send_page_view: false });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/journey.css">
</head>

<body>

  <!-- ─── LIGHT BURST ─── -->
  <div id="slot-light-burst"></div>

  <!-- ─── INTRO OVERLAY ─── -->
  <div id="slot-intro-overlay"></div>

  <!-- ─── CROSSROADS ─── -->
  <div id="slot-crossroads"></div>

  <!-- ─── COMING SOON (journey) ─── -->
  <div id="slot-coming-soon"></div>

  <!-- ─── MAIN SITE ─── -->
  <div id="main-site">

    <!-- NAV -->
    <div id="slot-nav"></div>

    <!-- Page container -->
    <div class="snap-container" id="snap-container">
      <div id="slot-page-hero"></div>
      <div id="slot-page-programs"></div>
      <div id="slot-page-library"></div>
      <div id="slot-page-philosophy"></div>
      <div id="slot-page-community"></div>
      <div id="slot-page-contact"></div>
    </div>

  </div><!-- /main-site -->

  <!-- ─── JOURNEY MODE (fixed overlay, outside snap) ─── -->
  <div id="slot-page-journey"></div>

  <script>
    const sections = [
      { slot: 'slot-light-burst',    file: 'sections/light-burst.html' },
      { slot: 'slot-intro-overlay',  file: 'sections/intro-overlay.html' },
      { slot: 'slot-crossroads',     file: 'sections/crossroads.html' },
      { slot: 'slot-coming-soon',    file: 'sections/coming-soon.html' },
      { slot: 'slot-nav',            file: 'sections/nav.html' },
      { slot: 'slot-page-hero',      file: 'sections/page-hero.html' },
      { slot: 'slot-page-programs',  file: 'sections/page-programs.html' },
      { slot: 'slot-page-library',   file: 'sections/page-library.html' },
      { slot: 'slot-page-philosophy',file: 'sections/page-philosophy.html' },
      { slot: 'slot-page-community', file: 'sections/page-community.html' },
      { slot: 'slot-page-contact',   file: 'sections/page-contact.html' },
      { slot: 'slot-page-journey',   file: 'sections/page-journey.html' },
    ];

    Promise.all(
      sections.map(({ slot, file }) =>
        fetch(file)
          .then(r => {
            if (!r.ok) throw new Error(`Failed to load ${file}: ${r.status}`);
            return r.text();
          })
          .then(html => {
            document.getElementById(slot).innerHTML = html;
          })
          .catch(err => {
            console.error(err);
            document.getElementById(slot).innerHTML =
              `<!-- could not load ${file} -->`;
          })
      )
    ).then(() => {

      // Inject footer into every page
      fetch('sections/footer.html')
        .then(r => r.text())
        .then(html => {
          document.querySelectorAll('.page').forEach(page => {
            const footer = document.createElement('div');
            footer.innerHTML = html;
            page.appendChild(footer);
          });
        });

      // Boot main.js first
      const script = document.createElement('script');
      script.src = '/js/main.js';
      script.onload = () => {
        // Only call after main.js has fully loaded
        if (typeof initStatCounter === 'function') initStatCounter();
        // SEO router wraps navigateTo / enterClassicMode, so it must load
        // after main.js has defined them.
        const seoRouter = document.createElement('script');
        seoRouter.src = '/js/seo-router.js';
        document.body.appendChild(seoRouter);
      };
      document.body.appendChild(script);

      // Load journey.js independently
      const journeyScript = document.createElement('script');
      journeyScript.src = '/js/journey.js';
      document.body.appendChild(journeyScript);

    });
  </script>

</body>
</html>
